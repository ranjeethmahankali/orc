name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y cmake
      - name: Update Rust
        run: rustup update stable
      - name: Build C (Debug)
        run: cmake -S c/ -B build/debug -DCMAKE_BUILD_TYPE=Debug && cmake --build build/debug
      - name: Run C tests
        run: build/debug/orc_sdk_tests && build/debug/deck_ops_plugin_tests
      - name: Build Rust
        run: cargo build --verbose --all-targets --all-features
      - name: Check bindings
        run: cargo run -p bindings_generator -- c/orc_abi.h --rust-check rust/orc_sdk/src/bindings.rs --python-check python/bindings.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-features --verbose
      - name: Generate Rust docs
        run: cargo doc --all-features --no-deps
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install numpy
      - name: Run Python tests
        working-directory: python
        run: ../.venv/bin/python3 test.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable
      - name: Build C (Debug)
        run: cmake -S c/ -B build/debug -DCMAKE_BUILD_TYPE=Debug && cmake --build build/debug --config Debug
      - name: Run C tests
        run: build/debug/orc_sdk_tests.exe && build/debug/deck_ops_plugin_tests.exe
      - name: Build Rust
        run: cargo build --verbose --all-targets --all-features
      - name: Check bindings
        run: cargo run -p bindings_generator -- c/orc_abi.h --rust-check rust/orc_sdk/src/bindings.rs --python-check python/bindings.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-features --verbose
      - name: Generate Rust docs
        run: cargo doc --all-features --no-deps
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/Scripts/pip install numpy
      - name: Run Python tests
        working-directory: python
        run: ../.venv/Scripts/python3 test.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable
      - name: Build C (Debug)
        run: cmake -B build/debug -S c -DCMAKE_BUILD_TYPE=Debug && cmake --build build/debug
      - name: Run C tests
        run: build/debug/orc_sdk_tests && build/debug/deck_ops_plugin_tests
      - name: Build Rust
        run: cargo build --verbose --all-targets --all-features
      - name: Check bindings
        run: cargo run -p bindings_generator -- c/orc_abi.h --rust-check rust/orc_sdk/src/bindings.rs --python-check python/bindings.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-features --verbose
      - name: Generate Rust docs
        run: cargo doc --all-features --no-deps
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install numpy
      - name: Run Python tests
        working-directory: python
        run: ../.venv/bin/python3 test.py
